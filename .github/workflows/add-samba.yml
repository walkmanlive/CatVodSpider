name: Add Samba spider (one-time)

# 一次性工作流：加入 Samba 爬虫（改写自其他仓库，已适配本项目）
#   - 新增 spider/Samba.java 和 bean/samba/Drive.java
#   - build.gradle 加入 smbj 依赖
#   - proguard-rules.pro 加入 smbj 的保留规则
# 运行成功后可以把本文件删掉。

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-samba:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write Samba.java and Drive.java
        run: |
          set -e
          mkdir -p app/src/main/java/com/github/catvod/bean/samba
          cat > app/src/main/java/com/github/catvod/spider/Samba.java <<'EOF'
          package com.github.catvod.spider;

          import android.content.Context;
          import android.text.TextUtils;

          import com.github.catvod.bean.Class;
          import com.github.catvod.bean.Result;
          import com.github.catvod.bean.Vod;
          import com.github.catvod.bean.samba.Drive;
          import com.github.catvod.crawler.Spider;
          import com.github.catvod.net.OkHttp;
          import com.github.catvod.utils.Image;
          import com.github.catvod.utils.Util;
          import com.hierynomus.msfscc.FileAttributes;
          import com.hierynomus.msfscc.fileinformation.FileIdBothDirectoryInformation;
          import com.hierynomus.protocol.commons.EnumWithValue;

          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.Iterator;
          import java.util.List;
          import java.util.Locale;

          public class Samba extends Spider {

              private List<Drive> drives;
              private String extend;

              private void fetchRule() {
                  if (drives != null && !drives.isEmpty()) return;
                  if (extend.startsWith("http")) extend = OkHttp.string(extend);
                  drives = Drive.arrayFrom(extend);
              }

              private Drive getDrive(String name) throws IOException {
                  int index = drives.indexOf(new Drive(name));
                  if (index < 0) throw new IOException("Unknown drive: " + name);
                  return drives.get(index);
              }

              private boolean isFolder(FileIdBothDirectoryInformation item) {
                  return EnumWithValue.EnumUtils.isSet(item.getFileAttributes(), FileAttributes.FILE_ATTRIBUTE_DIRECTORY);
              }

              private boolean isFile(FileIdBothDirectoryInformation item) {
                  return !isFolder(item);
              }

              @Override
              public void init(Context context, String extend) {
                  this.extend = extend;
                  fetchRule();
              }

              @Override
              public String homeContent(boolean filter) {
                  List<Class> classes = new ArrayList<>();
                  for (Drive drive : drives) classes.add(drive.toType());
                  return Result.get().classes(classes).string();
              }

              @Override
              public String categoryContent(String tid, String pg, boolean filter, HashMap<String, String> extend) throws Exception {
                  String key = tid.contains("/") ? tid.substring(0, tid.indexOf("/")) : tid;
                  String path = tid.contains("/") ? tid.substring(tid.indexOf("/") + 1) : "";
                  Drive drive = getDrive(key);
                  List<Vod> list = new ArrayList<>();
                  for (FileIdBothDirectoryInformation item : getList(drive, path)) {
                      boolean folder = isFolder(item);
                      String vodId = getPath(key, path, item.getFileName());
                      list.add(new Vod(vodId, item.getFileName(), folder ? Image.FOLDER : Image.VIDEO, "", folder));
                  }
                  return Result.get().vod(list).page().string();
              }

              @Override
              public String detailContent(List<String> ids) throws Exception {
                  String tid = ids.get(0);
                  String key = tid.contains("/") ? tid.substring(0, tid.indexOf("/")) : tid;
                  String path = tid.contains("/") ? tid.substring(tid.indexOf("/") + 1) : "";
                  String parent = path.contains("/") ? path.substring(0, path.lastIndexOf("/")) : "";
                  String name = parent.contains("/") ? parent.substring(parent.lastIndexOf("/") + 1) : key;
                  Drive drive = getDrive(key);
                  List<String> playUrls = new ArrayList<>();
                  for (FileIdBothDirectoryInformation item : getList(drive, parent)) {
                      if (isFile(item)) {
                          playUrls.add(item.getFileName() + "$" + getPath(drive.getServer(), parent, item.getFileName()));
                      }
                  }
                  Vod vod = new Vod();
                  vod.setVodId(name);
                  vod.setVodName(name);
                  vod.setVodPlayFrom(key);
                  vod.setVodPic(Image.VIDEO);
                  vod.setVodPlayUrl(TextUtils.join("#", playUrls));
                  return Result.string(vod);
              }

              @Override
              public String playerContent(String flag, String id, List<String> vipFlags) {
                  return Result.get().url(id).string();
              }

              private String getPath(String... texts) {
                  List<String> items = new ArrayList<>();
                  for (String text : texts) if (!TextUtils.isEmpty(text)) items.add(text);
                  return TextUtils.join("/", items);
              }

              private List<FileIdBothDirectoryInformation> getList(Drive drive, String path) throws IOException {
                  List<FileIdBothDirectoryInformation> items = new ArrayList<>(drive.getShare().list(getPath(drive.getSubPath(), path)));
                  Iterator<FileIdBothDirectoryInformation> iterator = items.iterator();
                  while (iterator.hasNext()) {
                      FileIdBothDirectoryInformation item = iterator.next();
                      if (isFolder(item) && item.getFileName().startsWith(".")) iterator.remove();
                      else if (isFile(item) && !Util.isMedia(item.getFileName())) iterator.remove();
                  }
                  Collections.sort(items, new Comparator<FileIdBothDirectoryInformation>() {
                      @Override
                      public int compare(FileIdBothDirectoryInformation o1, FileIdBothDirectoryInformation o2) {
                          if (isFolder(o1) && isFile(o2)) return -1;
                          if (isFile(o1) && isFolder(o2)) return 1;
                          return o1.getFileName().toLowerCase(Locale.ROOT).compareTo(o2.getFileName().toLowerCase(Locale.ROOT));
                      }
                  });
                  return items;
              }

              @Override
              public void destroy() {
                  if (drives == null) return;
                  for (Drive drive : drives) drive.release();
              }
          }
          EOF
          cat > app/src/main/java/com/github/catvod/bean/samba/Drive.java <<'EOF'
          package com.github.catvod.bean.samba;

          import android.net.Uri;
          import android.text.TextUtils;

          import com.github.catvod.bean.Class;
          import com.google.gson.Gson;
          import com.google.gson.annotations.SerializedName;
          import com.google.gson.reflect.TypeToken;
          import com.hierynomus.smbj.SMBClient;
          import com.hierynomus.smbj.auth.AuthenticationContext;
          import com.hierynomus.smbj.connection.Connection;
          import com.hierynomus.smbj.session.Session;
          import com.hierynomus.smbj.share.DiskShare;

          import java.io.IOException;
          import java.lang.reflect.Type;
          import java.util.ArrayList;
          import java.util.List;

          public class Drive {

              @SerializedName("drives")
              private List<Drive> drives;
              @SerializedName("name")
              private String name;
              @SerializedName("server")
              private String server;
              @SerializedName(value = "user", alternate = {"username"})
              private String user;
              @SerializedName(value = "pass", alternate = {"password"})
              private String pass;
              @SerializedName("domain")
              private String domain;

              private transient SMBClient client;
              private transient Connection connection;
              private transient Session session;
              private transient DiskShare share;
              private transient Uri uri;

              /**
               * 支持两种配置：
               * 1. 数组：[{"name":"NAS","server":"smb://192.168.1.2/video/movies","user":"","pass":""}]
               * 2. 对象：{"drives":[ ...同上... ]}
               */
              public static List<Drive> arrayFrom(String str) {
                  str = str == null ? "" : str.trim();
                  if (str.startsWith("{")) {
                      Drive root = new Gson().fromJson(str, Drive.class);
                      return root == null || root.drives == null ? new ArrayList<>() : root.drives;
                  }
                  Type type = new TypeToken<List<Drive>>() {}.getType();
                  List<Drive> items = new Gson().fromJson(str, type);
                  return items == null ? new ArrayList<>() : items;
              }

              public Drive() {
              }

              public Drive(String name) {
                  this.name = name;
              }

              public String getName() {
                  return TextUtils.isEmpty(name) ? "" : name;
              }

              private Uri getUri() {
                  if (uri == null) uri = Uri.parse(TextUtils.isEmpty(server) ? "" : server.trim());
                  return uri;
              }

              private String getHost() {
                  String host = getUri().getHost();
                  return host == null ? "" : host;
              }

              private String getShareName() {
                  List<String> segments = getUri().getPathSegments();
                  return segments.isEmpty() ? "" : segments.get(0);
              }

              /**
               * 共享名之后的子目录，例如 smb://host/video/movies/2024 → movies/2024
               */
              public String getSubPath() {
                  List<String> segments = getUri().getPathSegments();
                  return segments.size() <= 1 ? "" : TextUtils.join("/", segments.subList(1, segments.size()));
              }

              private String getUser() {
                  if (!TextUtils.isEmpty(user)) return user;
                  String info = getUri().getUserInfo();
                  if (TextUtils.isEmpty(info)) return "";
                  return info.contains(":") ? info.substring(0, info.indexOf(":")) : info;
              }

              private String getPass() {
                  if (!TextUtils.isEmpty(user)) return TextUtils.isEmpty(pass) ? "" : pass;
                  String info = getUri().getUserInfo();
                  return TextUtils.isEmpty(info) || !info.contains(":") ? "" : info.substring(info.indexOf(":") + 1);
              }

              private String getDomain() {
                  return TextUtils.isEmpty(domain) ? "" : domain;
              }

              /**
               * 播放用的基础地址：smb://[用户:密码@]主机[:端口]/共享名[/子目录]
               */
              public String getServer() {
                  StringBuilder sb = new StringBuilder("smb://");
                  if (!getUser().isEmpty()) {
                      sb.append(Uri.encode(getUser()));
                      if (!getPass().isEmpty()) sb.append(":").append(Uri.encode(getPass()));
                      sb.append("@");
                  }
                  sb.append(getHost());
                  if (getUri().getPort() > 0) sb.append(":").append(getUri().getPort());
                  sb.append("/").append(getShareName());
                  if (!getSubPath().isEmpty()) sb.append("/").append(getSubPath());
                  return sb.toString();
              }

              public synchronized DiskShare getShare() throws IOException {
                  if (share == null || !share.isConnected()) connect();
                  return share;
              }

              private void connect() throws IOException {
                  release();
                  int port = getUri().getPort();
                  client = new SMBClient();
                  connection = port > 0 ? client.connect(getHost(), port) : client.connect(getHost());
                  AuthenticationContext auth = getUser().isEmpty() ? AuthenticationContext.guest() : new AuthenticationContext(getUser(), getPass().toCharArray(), getDomain());
                  session = connection.authenticate(auth);
                  share = (DiskShare) session.connectShare(getShareName());
              }

              public synchronized void release() {
                  try {
                      if (share != null) share.close();
                  } catch (Exception ignored) {
                  }
                  try {
                      if (session != null) session.close();
                  } catch (Exception ignored) {
                  }
                  try {
                      if (connection != null) connection.close();
                  } catch (Exception ignored) {
                  }
                  try {
                      if (client != null) client.close();
                  } catch (Exception ignored) {
                  }
                  share = null;
                  session = null;
                  connection = null;
                  client = null;
              }

              public Class toType() {
                  return new Class(getName(), getName(), "1");
              }

              @Override
              public boolean equals(Object obj) {
                  if (this == obj) return true;
                  if (!(obj instanceof Drive)) return false;
                  Drive it = (Drive) obj;
                  return getName().equals(it.getName());
              }

              @Override
              public int hashCode() {
                  return getName().hashCode();
              }
          }
          EOF

      - name: Update build.gradle and proguard-rules.pro
        run: |
          set -e
          python3 - <<'PY'
          p = 'app/build.gradle'
          s = open(p, encoding='utf-8').read()
          dep = "    implementation 'com.hierynomus:smbj:0.11.5'"
          if 'com.hierynomus:smbj' not in s:
              anchor = "    implementation 'org.jsoup:jsoup:1.15.3'"
              if anchor not in s:
                  raise SystemExit('找不到 jsoup 依赖行，请手动在 dependencies 里加入: ' + dep.strip())
              s = s.replace(anchor, anchor + '\n' + dep)
              open(p, 'w', encoding='utf-8').write(s)

          p = 'app/proguard-rules.pro'
          s = open(p, encoding='utf-8').read()
          if 'com.hierynomus' not in s:
              if not s.endswith('\n'):
                  s += '\n'
              s += (
                  '\n# Smbj\n'
                  '-keep class com.hierynomus.** { *; }\n'
                  '-keep class net.engio.mbassy.** { *; }\n'
                  '-dontwarn javax.el.**\n'
                  '-dontwarn org.ietf.jgss.**\n'
                  '-dontwarn javax.security.auth.kerberos.**\n'
              )
              open(p, 'w', encoding='utf-8').write(s)
          PY

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat | tail -n 5
          if git diff --cached --quiet; then
            echo "没有需要提交的改动（可能已经添加过），跳过"
          else
            git commit -m "feat: add Samba spider"
            git push
          fi
